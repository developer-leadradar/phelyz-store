; PHP settings for Phelyz Store.
;
; The size limits that used to be here have been removed. The server's own
; php.ini, managed from cPanel -> Software -> MultiPHP INI Editor, already
; allows far more than this site needs:
;
;   upload_max_filesize   64M
;   post_max_size         64M
;   memory_limit          384M
;
; Setting smaller numbers here would only cap what the host already permits,
; because .user.ini is read after php.ini. Product photos are shrunk in the
; browser before they are sent anyway - see assets/js/admin-image-upload.js -
; so a 5MB camera file arrives well under a megabyte.
;
; If those limits ever need changing, change them in MultiPHP INI Editor
; rather than here: that writes to php.ini, which always applies.

; Never print PHP's own warnings to a visitor. They give away the layout of the
; server and, in an API response, corrupt the JSON the browser is waiting for.
; config.php sets this at runtime too; having it here as well covers anything
; that fails before config.php has been read.
display_errors = Off
display_startup_errors = Off
log_errors = On

; Enough slots for a full gallery in one submission.
max_file_uploads = 30
