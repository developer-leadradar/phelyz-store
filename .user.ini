; PHP limits for Phelyz Store.
;
; Product photos are taken on a phone and uploaded straight from it, with no
; resizing first. A Galaxy S22 Ultra shoots 3000x4000, which lands at roughly
; 3-5MB per shot, and several are usually added to one product at once.
;
; The stock cPanel limits (often 2M upload / 8M post / 128M memory) reject
; those before PHP ever sees them, so they are raised here. The site still
; shrinks every photo down to a web-sized copy after it arrives - see
; optimiseImageFile() in includes/functions.php - so the big file only has to
; survive long enough to be resized.
;
; cPanel runs PHP as FastCGI, which reads .user.ini from the document root.
; If a value here is ever ignored, set the same value in
; cPanel -> Software -> MultiPHP INI Editor, which always wins.

; One photo. 20M leaves plenty of headroom over a 5MB camera file.
upload_max_filesize = 20M

; The whole form, so this has to cover every photo in one submission plus the
; rest of the product fields. Eight full-size photos still fit.
post_max_size = 120M

; Resizing a 12-megapixel photo needs the uncompressed bitmap in memory:
; 3000 x 4000 x 4 bytes is about 48MB for the source alone, plus the resized
; copy. Too low a limit here kills the whole request and loses the product.
memory_limit = 256M

; Resampling several large photos in one submission takes a few seconds each.
max_execution_time = 300
max_input_time = 300

; Enough slots for a full gallery in one go.
max_file_uploads = 30

; Never print PHP's own warnings to a visitor. They give away the layout of the
; server and, in an API response, corrupt the JSON the browser is waiting for.
; config.php sets this too; having it here as well covers anything that fails
; before config.php has been read.
display_errors = Off
display_startup_errors = Off
log_errors = On
